          accessed_date: "2026-10-02"
          compatibility_decision: "Use the relaxed, self-contained local adaptation; strict English rules, word caps, and rewriting examples are incompatible with the approved multilingual presentation method."
        supporting_assets:
          required: [skills/human-readable-communication/LICENSE]
          included: [skills/human-readable-communication/LICENSE]
          omitted:
            - path: references/writing-rules.md
              reason: "Strict English summary replaced by the self-contained relaxed local method."
            - path: examples/before-after.md
              reason: "Some examples change obligation or add content, conflicting with meaning preservation."
            - path: scripts/ste-lint.py
              reason: "Hard English word caps and punctuation checks are incompatible; no replacement linter."
  role_map_policy:
    knowledge_base_required_for: full_workflow_or_partial_scope_including_knowledge_management
    selected_roles_without_knowledge_may_omit_knowledge_base_with_reason: outside_adoption_scope
    per_run_knowledge_opt_in: false
    conditional_security_selection: "Use ordinary scope/planning information or the actual diff to identify a concrete affected data, permission, or action boundary and operation, including indirect private caches, derived data, and exports. Task titles and security keywords alone neither trigger nor exclude the method. Load only relevant skill/reference sections; add no mandatory per-task screening, field, checklist, scan, report, specialist invocation, gate, or universal loading. Main Agent coordinates normally; Verifier runs existing approved checks. A full audit needs separately approved scope."
  role_map:
    main_agent:
      required: [context-engineering, clarification, knowledge-base]
      conditional:
        doubt-driven-development: "non-trivial, high-stakes, unfamiliar, or hard-to-verify decisions"
        human-readable-communication: "long or complex explanations, user-facing Plan presentations, and reports"
      artifact_contract: schemas/artifacts.md
    intake:
      required: [specification, clarification, source-driven-development, knowledge-base]
      conditional:
        root-cause: "bugs or failures"
      artifact_contract: schemas/artifacts.md
    planner:
      required: [task-decomposition, context-engineering, source-driven-development, knowledge-base]
      conditional:
        root-cause: "bug with Intake evidence incomplete, contradictory, or insufficient to justify the plan"
        code-quality: "when choosing new or changed dependencies, shared abstractions, or state boundaries"
        security-and-hardening: "when a concrete affected data, permission, or action boundary and operation require security invariants, acceptance criteria, or validation planning"
      artifact_contract: schemas/artifacts.md
    test_engineer:
      required: [test-driven-development]
      conditional:
        code-quality: "when adding or changing helpers, fixtures, or nontrivial setup or assertions"
        security-and-hardening: "when authoring relevant security tests for a concrete affected data, permission, or action boundary and operation whose required behavior lacks sufficient existing coverage"
      artifact_contract: schemas/artifacts.md
    implementer:
      required: [code-quality, incremental-implementation]
      conditional:
        root-cause: "before retrying a failed check"
        security-and-hardening: "when implementation affects an identified data, permission, or action boundary and operation"
      artifact_contract: schemas/artifacts.md
    verifier:
      required: []
      conditional: {}
      artifact_contract: schemas/artifacts.md
    reviewer:
      required: [code-review, code-quality]
      conditional:
        security-and-hardening: "when the actual diff affects a concrete data, permission, or action boundary and operation, including concrete risk discovered during review"
        root-cause: "findings concern an unclear failure"
      artifact_contract: schemas/artifacts.md
    knowledge_curator:
      required: [knowledge-base, documentation-and-adrs]
      conditional: {}
      artifact_contract: schemas/artifacts.md
  supporting_references:
    - harness-artifacts
  root_cause:
    enabled: true
    used_by:
      - intake
      - planner
      - implementer
      - reviewer
    planner_trigger: "bug with Intake evidence incomplete, contradictory, or insufficient to justify the plan"
  doubt_driven_development:
    used_by:
      - main_agent
    trigger: "non-trivial, high-stakes, unfamiliar, or hard-to-verify decisions"
    reviewer_context: fresh
    require_external_cli_or_model: false

knowledge:
  included_in_full_workflow: true
  management_is_independently_selectable: true
  eligible_learning_requires_retention_in_approved_configured_system: true
  missing_paths_or_write_rules: blocked_never_invent_layout
  record_boundaries:
    policy: SPEC.md#documentation-knowledge-and-run-artifacts
    declarative_policy_only: true
    classification_basis: purpose_and_authority_not_folder_name
    project_documentation: intended_or_current_product_concepts_prds_requirements_specs_design_architecture_and_guides
    durable_knowledge: evidence_backed_reusable_discoveries_constraints_qualifications_procedures_and_recurring_failures
    run_artifacts: execution_specific_tickets_plans_results_checks_and_progress
    placement: preserve_suitable_approved_existing_homes_and_ownership
    home_reuse_requires: compatible_discovered_or_approved_purpose_and_ownership
    general_project_documentation_area_is_implicit_learning_or_run_home: false
    unresolved_destinations: never_guess
    authoritative_homes_per_substantive_record: 1
    canonical_documents_and_decisions: cite_instead_of_copy_into_knowledge
    distinct_supported_topic_overlap: allowed_with_relevant_canonical_source_refs
    normative_requirements_and_learned_evidence: separate
    curator_general_project_documentation_write_permission: false
    requirement_changes: applicable_approved_scope_and_owner_required
    unresolved_contradictions: preserve_explicitly
    ordinary_project_docs_inherit_knowledge_metadata_by_topic_or_location: false
  startup_navigation_roles: [main_agent, intake, planner]
  retrieval_order: [configured_startup, matching_index_navigation_hints, relevant_topic, focused_source_refs]
  broader_scan_requires_recorded_reason: absent_stale_contradictory_or_insufficient_navigation
  navigation_hints:
    heading: Navigation Hints
    table_columns: [Task, Target]
    target: one_existing_local_page_or_category_link
    empty_state: "No navigation hints yet."
  topic_metadata: [type, description, source_refs, updated, status]
  typed_reference_kinds: [local, url, command, artifact]
  command_refs_are_inert: true
  command_alone_establishes_evidence: false
  preserve_category_protection: true
  after_curator_final_write_checks_required: true
  unavailable_required_check_status: blocked
  integrity_check_implementations: [compatible_existing_target_checker, translated_compatible_checks, optional_reference_checker]
  reference_checker_runtime: "Python 3.10+ standard library only; no third-party packages or installation step"
  reference_checker_reader_limits_do_not_narrow_portable_contracts: true
  python_required_for_all_adoptions: false
  target_path_policy: "Discover and preserve the target's existing knowledge paths and conventions; propose a new location only when needed and approved."
  target_paths:
    root: discovered_or_explicitly_approved
    startup_entry: discovered_or_explicitly_approved
    action_log: discovered_or_explicitly_approved_or_none
  source_repository_example:
    root: knowledge/
    domain_root: knowledge/domain/
    domain_root_is_target_default: false
    startup_reads:
      - knowledge/main.md
    optional_reads:
      - knowledge/log.md
    run_state: .harness/runs/
    internal_learning_folder: domain/self/
    external_compilation_folder: domain/derived/
    raw_external_material_folder: domain/sources/
    templates_folder: _template/
    examples_folder: _example/
    require_lint_after_update: true
    validation_layout: knowledge/validation-layout.yaml
    integrity_check: "python3 -B -S scripts/validate_knowledge.py --repo-root . --knowledge-root knowledge --layout knowledge/validation-layout.yaml"

roles:
  intake: prompts/intake.md
  planner: prompts/planner.md
  test_engineer: prompts/test-engineer.md
  implementer: prompts/implementer.md
  verifier: prompts/verifier.md
  reviewer: prompts/reviewer.md
  knowledge_curator: prompts/knowledge-curator.md

artifacts:
  contracts: schemas/artifacts.md

skill_provenance:
  registry: skills/origins.md
  rule: "Every skill must declare an origin or project-specific status in the registry."
