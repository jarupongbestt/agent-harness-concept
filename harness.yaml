version: "0.1"
name: portable-agent-harness

application:
  protocol: APPLY.md
  folder_layout: conceptual_not_prescriptive
  coordination_language: en
  user_facing_language: follow_user_input
  allow_hybrid_user_facing_response: true
  require_user_choices_before_adapter_changes:
    - target_platforms
    - existing_instruction_migration
    - model_policy
    - knowledge_and_run_state_paths
  model_names_are_time_sensitive: true
  native_convention_discovery:
    required: true
    read_only: true
    required_before:
      - concept_mapping
      - file_map_proposal
      - target_write
    identify:
      - platform
      - platform_version
      - operating_mode
      - host_runtime
    identity_policy:
      required: true
      if_missing_or_ambiguous:
        allowed_action: minimal_read_only_clarification
        mapping_allowed: false
        approval_to_proceed_allowed: false
        target_writes_allowed: false
        unresolved_result: blocked
    inspect:
      - existing_target_instructions
      - native_configuration
      - agent_subagent_support
      - skills
      - permissions
      - checks
      - knowledge_and_run_state
    evidence:
      first_party_sources_required: true
      required_fields:
        - accessed_date
        - applicable_platform_version
        - applicable_operating_mode
        - finding
        - confidence
        - verification_evidence_ref
      source_reference:
        exactly_one_of:
          - source_url
          - source_path
        source_path_must_be_exact: true
      mapped_capability_fields:
        - exact_native_destination
        - mechanism
        - verification_evidence_ref
    verify_host_capabilities: true
    unknown_policy: stop_and_ask_or_report_blocked
    allow_guessing_paths: false
    output_shape_guard:
      required_before_approval: true
      require_native_layout_preview: true
      source_tree_reproduction_forbidden: true
      fail_if_unapproved_source_paths_are_added: true
      source_tree_paths:
        - adapters/
        - knowledge/
        - prompts/
        - schemas/
        - skills/
      source_paths_allowed_only_when:
        - already_present_in_target
        - independently_required_by_target
        - explicitly_approved
    adapter_output:
      require_native_destinations: true
      unknown_destination_policy: blocked
  discovery_invariants:
    per_destination_status_required: true
    status_vocabulary:
      - verified
      - unknown
      - blocked
    verified_requires:
      - every_relevant_destination_status_verified
      - every_relevant_evidence_status_verified
      - every_reuse_or_translate_entry_has_exact_native_destination
      - every_reuse_or_translate_entry_has_mechanism
      - every_reuse_or_translate_entry_has_verification_evidence_ref
    invalid_evidence:
      confidence_values:
        - low
      statuses:
        - stale
        - contradictory
        - low_confidence
        - unknown
      maps_to_status: unknown
      may_map_to_blocked: true
    unknown_or_blocked:
      approval_decision_forbidden:
        - proceed
      target_writes_forbidden: true
      mapping_and_file_map_forbidden: true
      required_behavior: stop_and_ask_or_report_blocked
  native_post_write_verification:
    required: true
    required_after: target_write
    file_existence_alone_is_insufficient: true
    per_destination: true
    status_vocabulary:
      - verified
      - unknown
      - blocked
    required_record_fields:
      - capability
      - status
      - exact_native_destination
      - mechanism
      - verification_evidence_ref
      - accessed_date
      - applicable_platform_version
      - applicable_operating_mode
      - finding
      - confidence
    evidence:
      required: true
      source_reference:
        exactly_one_of:
          - source_url
          - source_path
        source_path_must_be_exact: true
    result_rules:
      verified_requires:
        - every_written_destination_has_a_record
        - every_written_destination_status_verified
        - every_record_has_required_evidence
      unknown_or_blocked:
        approval_decision_forbidden:
          - proceed
        stop_before_additional_writes: true
        run_status: blocked
        success_claim_forbidden: true
    failure_behavior:
      missing_record_or_evidence: blocked
      failed_native_check: blocked
      unknown_evidence: blocked
      stop_before_additional_writes: true
      approval_decision_proceed_forbidden: true

# The platform adapter maps these logical capabilities to native tools.
main_agent:
  # This is the harness repository's own bootstrap source, not a universal
  # target-repository destination. Target destinations require discovery and
  # explicit approval.
  bootstrap: AGENTS.md
  bootstrap_role: source_repository_bootstrap
  bootstrap_target_destination: null
  bootstrap_target_destination_policy: independently_discovered_and_approved
  prompt: AGENTS.md
  prompt_role: source_repository_bootstrap
  prompt_target_destination: null
  prompt_target_destination_policy: independently_discovered_and_approved
  owns:
    - orchestration
    - clarification
    - approval
    - routing
    - recovery
    - finalization

workflow:
  stages:
    - intake
    - clarify
    - plan
    - approval
    - test_design
    - implement
    - verify
    - review
    - knowledge_update
    - finalize
  approval:
    required_before_edit: true
    options:
      - proceed
      - ask_or_adjust
  execution:
    scheduler: dependency_aware
    parallel_independent_slices: true
    default_mode: in_place_uncommitted
    allow_commit: false
    allow_push: false
    allow_merge: false
  reentry:
    intake:
      default_passes: 1
      allowed_triggers:
        - user_clarification_changes_ticket
        - newly_discovered_ticket_mismatch
    planner:
      default_passes: 1
      allowed_triggers:
        - explicit_human_plan_feedback
        - invalid_plan
        - scope_change
        - acceptance_criteria_change
        - dependency_invalidation
        - permission_invalidation
        - platform_invalidation
    implementer:
      retry_on:
        - verification_test_failure
        - acceptance_failure_with_valid_scope
        - verification_lint_failure
        - verification_build_failure
        - verification_check_failure
        - verifier_failure
      replan_only_on:
        - invalid_plan
        - scope_change
        - acceptance_criteria_change
        - dependency_invalidation
        - permission_invalidation
        - platform_invalidation
      max_retries_per_slice: 2

delegation:
  required: true
  fallback: "If the host has no subagent capability, preserve role boundaries and report the limitation."

routing:
  tier_0:
    planner: junior
    implementer: junior
    review: lightweight
  tier_1:
    planner: standard
    implementer: task_level
    review: standard
  tier_2:
    planner: senior
    implementer: task_level
    review: independent

testing:
  feature: create_or_extend
  bugfix: reproduce_first
  refactor: regression_only
  cosmetic: smoke_or_visual
  test_author: test_designer
  implementer_can_modify_tests: false

skills:
  source_root: skills/
  definitions:
    - context-engineering
    - specification
    - clarification
    - root-cause
    - task-decomposition
    - source-driven-development
    - incremental-implementation
    - test-driven-development
    - code-review
    - security-and-hardening
    - documentation-and-adrs
    - harness-artifacts
    - knowledge-base
  root_cause:
    enabled: true
    used_by:
      - intake
      - planner
      - implementer
      - reviewer

knowledge:
  root: knowledge/
  domain_root: knowledge/domain/
  startup_reads:
    - knowledge/main.md
  optional_reads:
    - knowledge/log.md
  run_state: .harness/runs/
  internal_learning_folder: domain/self/
  external_compilation_folder: domain/derived/
  raw_external_material_folder: domain/sources/
  templates_folder: _template/
  examples_folder: _example/
  require_lint_after_update: true

roles:
  intake: prompts/intake.md
  planner: prompts/planner.md
  test_designer: prompts/test-designer.md
  implementer: prompts/implementer.md
  verifier: prompts/verifier.md
  reviewer: prompts/reviewer.md
  knowledge_curator: prompts/knowledge-curator.md

artifacts:
  contracts: schemas/artifacts.md

skill_provenance:
  registry: skills/origins.md
  rule: "Every skill must declare an origin or project-specific status in the registry."
